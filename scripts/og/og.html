<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* FONTS */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: #060a13; color: #e7edf8;
    font-family: 'Space Grotesk', sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgb(125 160 255 / .12) 1px, transparent 1px), linear-gradient(90deg, rgb(125 160 255 / .12) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 75% at 22% 30%, #000 15%, transparent 72%);
  }
  .glow {
    position: absolute; left: -240px; top: -300px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgb(47 124 255 / .26), transparent 65%);
  }
  .in { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #97a3bc; }
  .logo { display: flex; align-items: center; gap: 14px; color: #e7edf8; }
  .mark { width: 40px; height: 40px; border: 2px solid #2f7cff; border-radius: 10px; display: grid; place-items: center; color: #7db2ff; font-size: 16px; font-weight: 600; }
  h1 { margin: 0; font-weight: 600; font-size: 104px; line-height: .98; letter-spacing: -.035em; }
  .hl { color: #7db2ff; }
  .ul { position: relative; display: inline-block; }
  .ul::after { content: ''; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 6px; background: #2f7cff; }
  .caret { display: inline-block; width: 7px; height: 78px; margin-left: 8px; background: #2f7cff; vertical-align: -4px; }
  .bottom { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #97a3bc; }
  .bottom b { color: #7db2ff; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="in">
    <div class="top">
      <div class="logo"><span class="mark">ak</span>kraditya23</div>
      <div>Aditya Kumar · DTU ’28</div>
    </div>
    <h1>I build <span class="hl">fast,</span><br><span class="ul">correct</span> systems<br>in C++<span class="caret"></span></h1>
    <div class="bottom"><span>Low-latency C++ · limit order book engine</span><span><b>6.8M</b> ops/s</span></div>
  </div>
</body>
</html>
